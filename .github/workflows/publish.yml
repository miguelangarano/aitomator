name: Publish to npm

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (for example: 0.2.0 or 1.0.0-beta.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    environment: npm
    env:
      MANUAL_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12

      - name: Apply and validate release version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${MANUAL_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid semantic version: ${MANUAL_VERSION}" >&2
              exit 1
            fi
            npm pkg set "version=${MANUAL_VERSION}"
          fi

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ -z "${PACKAGE_VERSION}" ]]; then
            echo "package.json does not contain a version" >&2
            exit 1
          fi

          echo "name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"

      - name: Reject an already-published version
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published." >&2
            echo "Bump package.json on release/* pushes, or enter a new version for manual releases." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Type-check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public --provenance

      - name: Write release summary
        run: |
          echo "## Published AItomator" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Package: \`${{ steps.package.outputs.name }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Version: \`${{ steps.package.outputs.version }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- npm: https://www.npmjs.com/package/${{ steps.package.outputs.name }}/v/${{ steps.package.outputs.version }}" >> "${GITHUB_STEP_SUMMARY}"
